# NOTE: at deploy time the pipeline applies overrides from the
# bassnext.pipelines repo (resource-config/<service>/<env>.yaml) ON TOP of
# this file. In particular resources, probes, hpa, pdb and configMapData
# entries here can differ from what actually runs; check resource-config
# for the effective per-environment values.
replicaCount: 1

ingress:
  className: dp-qa-public-shared-nginx-v2
  hosts:
    bass:
      - bass-api.qa.dp.bosch-pt.com

# Minimal amount of available replicas, that won't be voluntarily disrupted
# enabled based on env and currently available only for `review` and `prod`.
# NOTE: When using helmUpgrade, these values are overridden in helm.gradle